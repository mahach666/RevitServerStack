name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # The tag must name the newest CHANGELOG entry, and that entry must be a version, not "Unreleased".
      - name: Check the tag against CHANGELOG.md
        shell: pwsh
        run: |
          $heading = Get-Content -LiteralPath CHANGELOG.md -Encoding utf8 | Where-Object { $_.StartsWith('## [') } | Select-Object -First 1
          if (-not $heading) { throw 'CHANGELOG.md has no "## [" entry.' }
          $version = [regex]::Match($heading, '^## \[([^\]]+)\]').Groups[1].Value
          if ($version -eq 'Unreleased') { throw 'The newest CHANGELOG.md entry is "Unreleased": give it a version and a date before tagging.' }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "The newest CHANGELOG.md entry [$version] is not a version." }
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw "The tag $env:GITHUB_REF_NAME does not match the newest CHANGELOG.md version v$version." }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Self-checks
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File panel/tests/Invoke-Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "Invoke-Tests.ps1 failed with exit code $LASTEXITCODE" }
      - name: Build the release archive
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File launcher/Build.ps1 -Release
          if ($LASTEXITCODE -ne 0) { throw "Build.ps1 failed with exit code $LASTEXITCODE" }
      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = "dist/RevitServerStack-$env:VERSION.zip"
          foreach ($file in $zip, "$zip.sha256", 'dist/RELEASE_NOTES.md') {
            if (-not (Test-Path -LiteralPath $file)) { throw "$file was not built." }
          }
          # A version with a hyphen is a prerelease.
          $flags = @()
          if ($env:VERSION.Contains('-')) { $flags += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME --title "Revit Server Stack $env:VERSION" --notes-file dist/RELEASE_NOTES.md @flags $zip "$zip.sha256"
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
