services:
  rs2021:
    build:
      context: ../src/rs2021
      args:
        INSTALLER_SHA256: ${RS2021_INSTALLER_SHA256:-}   # optional, see README.md
    container_name: rs2021
    ports:
      - 2021:80   # upstream for the reverse proxy (docker-compose.proxy.yml)
    volumes:
      - ./rs2021:C:/ProgramData/Autodesk/Revit Server 2021/Projects
