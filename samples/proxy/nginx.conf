worker_processes auto;
events { worker_connections 1024; }

http {
    # Revit central models are large -> never cap or buffer the body.
    client_max_body_size 0;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout 3600s;

    # Each rs<year> Windows container publishes container:80 on the host as <year>:80.
    # From this Linux proxy container we reach the host via host.docker.internal.
    upstream rs2020 { server host.docker.internal:2020; }
    upstream rs2021 { server host.docker.internal:2021; }
    upstream rs2022 { server host.docker.internal:2022; }
    upstream rs2023 { server host.docker.internal:2023; }
    upstream rs2024 { server host.docker.internal:2024; }
    upstream rs2025 { server host.docker.internal:2025; }
    upstream rs2026 { server host.docker.internal:2026; }
    upstream rs2027 { server host.docker.internal:2027; }

    server {
        listen 80 default_server;
        server_name _;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Every Revit Server IIS app embeds the version year in its path
        # (RevitServerAdmin2022, AdminService2022, RevitServerAdminRESTService2022,
        #  LocalService2022, ModelService2022, ...). Route purely by that year,
        # so a single host:80 serves every version with no port in the URL.
        location ~* /[A-Za-z]+2020(/|$) { proxy_pass http://rs2020; }
        location ~* /[A-Za-z]+2021(/|$) { proxy_pass http://rs2021; }
        location ~* /[A-Za-z]+2022(/|$) { proxy_pass http://rs2022; }
        location ~* /[A-Za-z]+2023(/|$) { proxy_pass http://rs2023; }
        location ~* /[A-Za-z]+2024(/|$) { proxy_pass http://rs2024; }
        location ~* /[A-Za-z]+2025(/|$) { proxy_pass http://rs2025; }
        location ~* /[A-Za-z]+2026(/|$) { proxy_pass http://rs2026; }
        location ~* /[A-Za-z]+2027(/|$) { proxy_pass http://rs2027; }

        location = / {
            default_type text/plain;
            return 200 "Revit Server proxy is up. Point Revit at this host name/IP with no port.\n";
        }
    }
}
