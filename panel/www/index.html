<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="panel-token" content="__PANEL_TOKEN__">
  <link rel="icon" href="data:,">
  <title>Revit Server Stack</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-title">
    <h1>Revit Server Stack</h1>
    <span class="subtitle" data-i18n="app.subtitle"></span>
  </div>

  <div class="engines" id="engines"></div>

  <div class="topbar-actions">
    <select id="lang" class="lang-select" data-i18n-title="lang.label" data-i18n-aria-label="lang.label"></select>
    <button type="button" class="btn btn-primary" id="btn-start-all" data-i18n="topbar.startAll"></button>
    <button type="button" class="btn" id="btn-stop-all" data-i18n="topbar.stopAll"></button>
    <button type="button" class="btn btn-ghost" id="btn-settings" data-i18n="topbar.settings"></button>
  </div>
</header>

<main>
  <div id="alerts" class="alerts"></div>

  <section class="cards" id="cards" data-i18n-aria-label="cards.aria"></section>

  <section class="panel-block">
    <div class="block-head">
      <h2 data-i18n="log.title"></h2>
      <span class="muted" id="log-title"></span>
      <div class="block-head-actions">
        <button type="button" class="btn btn-small" id="btn-cancel-job" data-i18n="log.cancel" hidden></button>
        <button type="button" class="btn btn-small btn-ghost" id="btn-clear-log" data-i18n="log.clear"></button>
      </div>
    </div>
    <pre class="log" id="log" tabindex="0"></pre>
    <div class="jobs" id="jobs"></div>
  </section>

  <footer class="foot">
    <span class="muted" id="foot-info"></span>
    <button type="button" class="btn btn-small btn-ghost" id="btn-shutdown" data-i18n="foot.shutdown"></button>
  </footer>
</main>

<!-- Settings -->
<div class="modal-backdrop" id="settings-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="modal-head">
      <h2 id="settings-title" data-i18n="settings.title"></h2>
      <button type="button" class="icon-btn" id="btn-close-settings" data-i18n-aria-label="settings.close">&times;</button>
    </div>

    <div class="modal-body">
      <div id="settings-errors" class="errors" hidden></div>

      <h3 data-i18n="settings.versions"></h3>
      <p class="hint" data-i18n="settings.versionsHint"></p>
      <div class="settings-table" id="settings-versions"></div>

      <h3 data-i18n="settings.proxy"></h3>
      <p class="hint" data-i18n="settings.proxyHint"></p>
      <div class="form-row">
        <label class="check">
          <input type="checkbox" id="proxy-enabled">
          <span data-i18n="settings.proxyEnabled"></span>
        </label>
        <label><span data-i18n="settings.port"></span>
          <input type="number" id="proxy-port" min="1" max="65535" class="input-narrow">
        </label>
        <label><span data-i18n="settings.image"></span>
          <input type="text" id="proxy-image" class="input-wide">
        </label>
      </div>

      <h3 data-i18n="settings.docker"></h3>
      <div class="form-row">
        <label><span data-i18n="settings.windowsContext"></span>
          <input type="text" id="windows-context" list="context-list" class="input-wide">
        </label>
        <label><span data-i18n="settings.proxyContext"></span>
          <input type="text" id="proxy-context" list="context-list" class="input-wide" data-i18n-placeholder="settings.currentContext">
        </label>
        <datalist id="context-list"></datalist>
      </div>
      <div class="form-row">
        <label><span data-i18n="settings.project"></span>
          <input type="text" id="compose-project" class="input-wide">
        </label>
        <p class="hint hint-inline" data-i18n-html="settings.projectHint"></p>
      </div>

      <h3 data-i18n="settings.remote"></h3>
      <p class="hint" data-i18n-html="settings.remoteHint"></p>
      <div class="form-row">
        <label><span data-i18n="settings.remoteName"></span>
          <input type="text" id="remote-name" class="input-wide" data-i18n-placeholder="settings.remoteNamePlaceholder">
        </label>
        <label><span data-i18n="settings.remoteEndpoint"></span>
          <input type="text" id="remote-endpoint" class="input-wide" data-i18n-placeholder="settings.remoteEndpointPlaceholder">
        </label>
        <button type="button" class="btn btn-small" id="btn-add-context" data-i18n="settings.addContext"></button>
      </div>
      <p class="hint" data-i18n-html="settings.hostHint"></p>
      <div class="form-row">
        <label><span data-i18n="settings.windowsHost"></span>
          <input type="text" id="windows-host" class="input-wide">
        </label>
        <label><span data-i18n="settings.proxyHost"></span>
          <input type="text" id="proxy-host" class="input-wide">
        </label>
      </div>

      <h3 data-i18n="settings.panel"></h3>
      <div class="form-row">
        <label><span data-i18n="settings.panelPort"></span>
          <input type="number" id="panel-port" min="1" max="65535" class="input-narrow">
        </label>
        <label class="check">
          <input type="checkbox" id="auto-open">
          <span data-i18n="settings.autoOpen"></span>
        </label>
      </div>
    </div>

    <div class="modal-foot">
      <span class="muted" id="settings-note"></span>
      <div>
        <button type="button" class="btn btn-ghost" id="btn-cancel-settings" data-i18n="settings.cancel"></button>
        <button type="button" class="btn btn-primary" id="btn-save-settings" data-i18n="settings.save"></button>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
